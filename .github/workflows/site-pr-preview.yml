name: Site PR Preview (Headless Browser Screenshots)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: site-pr-preview-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  preview-site-screenshots:
    name: Capture & Post Site Preview Screenshots
    # Only run automatically for repo OWNER/MEMBER/COLLABORATOR on in-repo PRs,
    # OR when a repo OWNER/MEMBER/COLLABORATOR explicitly comments "/preview" on a PR.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/preview') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head

      - name: Record tested PR commit SHA
        id: pr-meta
        run: |
          echo "head_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Build site data and capture headless Chromium screenshots
        run: |
          python scripts/build_site.py
          python scripts/capture_site_screenshots.py --output-dir /tmp/pr-screenshots

      - name: Upload screenshot bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-screenshots-pr-${{ env.PR_NUMBER }}
          path: /tmp/pr-screenshots
          retention-days: 14

      - name: Publish preview screenshots to orphan pr-previews branch
        id: publish-branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/pr-previews-repo
          cd /tmp/pr-previews-repo
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch origin pr-previews --depth=1 2>/dev/null; then
            git checkout -B pr-previews FETCH_HEAD
          else
            git checkout --orphan pr-previews
          fi

          rm -rf "pr-${PR_NUMBER}"
          mkdir -p "pr-${PR_NUMBER}"
          cp -r /tmp/pr-screenshots/* "pr-${PR_NUMBER}/"

          git add "pr-${PR_NUMBER}"
          git commit --allow-empty -m "Update site preview screenshots for PR #${PR_NUMBER} (${{ steps.pr-meta.outputs.head_sha }})"
          git push origin pr-previews --force
          echo "preview_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update sticky PR comment with inline screenshots
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = "${{ steps.pr-meta.outputs.head_sha }}";
            const previewSha = "${{ steps.publish-branch.outputs.preview_sha }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = "<!-- site-pr-preview-sticky-comment -->";

            const manifest = JSON.parse(
              fs.readFileSync("/tmp/pr-screenshots/manifest.json", "utf8")
            );

            const imageSections = manifest
              .map((item) => {
                const imgUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${previewSha}/pr-${prNumber}/${item.filename}`;
                return `#### ${item.title}\n<a href="${imgUrl}" target="_blank"><img src="${imgUrl}" alt="${item.title}" width="820" /></a>`;
              })
              .join("\n\n---\n\n");

            const body = [
              marker,
              "### 🖥️ Mission Control Site — Automated Headless Browser Preview",
              `Rendered from commit \`${headSha}\` in headless Chromium (\`1440×900\`) with **0 console/runtime errors** ([Workflow Run & Artifact](${runUrl})).`,
              "",
              imageSections,
              "",
              "> 💡 *Maintainers (`OWNER` / `MEMBER` / `COLLABORATOR`) can also trigger or refresh this preview on any PR by commenting `/preview`.*",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-pr-preview:
    name: Clean Up Closed PR Preview Screenshots
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove PR preview directory from pr-previews branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/pr-previews-cleanup
          cd /tmp/pr-previews-cleanup
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch origin pr-previews --depth=1 2>/dev/null; then
            git checkout -B pr-previews FETCH_HEAD
            if [ -d "pr-${PR_NUMBER}" ]; then
              git rm -rf "pr-${PR_NUMBER}"
              git commit -m "Clean up site preview screenshots for closed PR #${PR_NUMBER}"
              git push origin pr-previews
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
