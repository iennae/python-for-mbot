[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-for-mbot"
version = "0.2.0"
description = "Python interface to control and communicate with the original Makeblock mBot (mCore)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
hid = [
    "hidapi>=0.14.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"distanceTest.py" = ["F403", "F405"]
"hid_demo.py" = ["F403", "F405"]
"lightsenser.py" = ["F403", "F405"]
"linefollowTest.py" = ["F403", "F405"]
"motorTest.py" = ["F403", "F405"]
"musicTest.py" = ["F403", "F405"]
"rgbled.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
