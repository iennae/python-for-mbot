[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-for-mbot"
version = "0.2.0"
description = "Python interface and mission curriculum for the original Makeblock mBot (mCore)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
hid = [
    "hidapi>=0.14.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mbot*", "lib*"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "examples/*.py", "missions/*.py", "scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["F403", "F405"]
"missions/*.py" = ["F401", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests", "missions"]
pythonpath = ["src", ".", "missions"]
